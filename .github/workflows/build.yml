name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Packaging is not run here. media/ is the engine, generated by scripts/sync-engine.sh from a
      # separate source and absent from this repository, so a checkout can be typechecked and built
      # but cannot produce a working .vsix.
      - run: npm run build
